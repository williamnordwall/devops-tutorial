name: Trivy security scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: Scan dependencies and secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241

      - name: Scan for dependency vulnerabilities
        run: trivy fs --scanners vuln --exit-code 1 .

      - name: Scan for secrets
        if: always()
        run: trivy fs --scanners secret --exit-code 1 .
